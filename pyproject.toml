[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadvla-research-components"
version = "0.1.0"
description = "LeadVLA: Learning Follower-Aware Route Execution for Robot Leading"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9.1"]

[project.optional-dependencies]
policy = ["torch>=2.1"]
infra = ["scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["leadvla*", "leadinfra*", "leadbench*"]
